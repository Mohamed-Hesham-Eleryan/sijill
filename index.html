<style>
:root{--bg:#F5F7F6;--sf:#fff;--sf2:#EDF1EF;--ink:#13201D;--mu:#56675F;--ln:#E1E7E4;--ac:#0B7A6B;--ac2:#0B7A6B17;--bt:#fff;--ok:#1B8A4B;--wn:#B7791F;--er:#C0392B;--sh:0 1px 2px #0b1f1a0f,0 10px 28px -14px #0b1f1a30;--d:1;--sw:260px}
:root[dir=rtl]{--d:-1}
:root[data-t=dark]{--bg:#0D1312;--sf:#141C1A;--sf2:#1B2523;--ink:#E7EFEC;--mu:#93A6A0;--ln:#26312E;--ac:#3CC2A6;--ac2:#3CC2A61f;--bt:#06201A;--ok:#4CC27F;--wn:#E0A84A;--er:#EA6A5C;--sh:0 1px 2px #0006,0 10px 28px -14px #000b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:15px/1.55 "IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;touch-action:manipulation}
input[type=search]{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lg{width:30px;height:30px;flex:none}
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.main{min-width:0}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:20px 12px 16px;border-inline-end:1px solid var(--ln);background:color-mix(in srgb,var(--sf) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:600;padding:4px 8px 18px}
.nb{width:100%}
.sec{font-size:13px;color:var(--mu);padding:18px 10px 6px}
.files{flex:1;overflow:auto;display:grid;gap:2px;align-content:start;margin:0 -4px;padding:0 4px;overscroll-behavior:contain}
.fi{display:flex;gap:12px;align-items:center;width:100%;min-height:54px;padding:6px 10px;border-radius:12px;text-align:start;color:var(--mu);position:relative;transition:background .2s,color .2s,transform .15s}
.fi:hover{background:var(--sf2)}
.fi:active{transform:scale(.98)}
.fi.on{background:var(--ac2);color:var(--ac)}
.fi.on::before{content:"";position:absolute;inset-inline-start:-4px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--ac)}
.fi.nw{animation:nw .7s}
.fn{min-width:0;flex:1;display:grid;line-height:1.35}
.fn b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fi.on .fn b{color:var(--ac);font-weight:600}

.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 28px 12px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.mb,.ib.mb,.brand.mb{display:none}
.sp{flex:1}
.ib,.chip{min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:14px;transition:border-color .2s,box-shadow .2s,transform .15s}
.ib:hover,.chip:hover{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
.ib:active,.chip:active{transform:scale(.96)}
.ib:disabled{opacity:.4;cursor:not-allowed}
#chip{display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.o{background:var(--mu)}.dot.l{animation:pulse 2s infinite}
.pg{padding:8px 28px 140px;max-width:1120px;animation:fade .3s}
.pg.first{max-width:760px;margin:0 auto;padding-top:5vh}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
h2{font-size:16px;font-weight:600;margin-bottom:12px}
.mu{color:var(--mu)}.sm{font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh);min-width:0}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:22px}
.g3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;margin-top:22px}
.g3.one{grid-template-columns:minmax(0,1fr)}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.cw{position:relative;height:300px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;color:var(--mu);text-align:start;padding:10px 12px;border-bottom:1px solid var(--ln);font-size:13px;white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--ln)}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--sf2)}
.stk th:first-child,.stk td:first-child{position:sticky;inset-inline-start:0;background:var(--sf);z-index:1}
.stk tbody tr:hover td:first-child{background:var(--sf2)}
.rw{cursor:pointer}
.n{text-align:end;font-variant-numeric:tabular-nums}
.bd{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.bd i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.bd.review i{background:var(--wn);animation:pulse 1.8s infinite}
.fi .bd{flex:none}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--ac);color:var(--bt);font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s,box-shadow .2s,filter .2s,background .2s}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld{display:grid;gap:4px}
.in{min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);padding:0 12px;transition:border-color .2s,box-shadow .2s}

.dd .ic{width:16px;height:16px;color:var(--mu);transition:transform .2s}
.dd[aria-expanded=true]{border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
.dd[aria-expanded=true] .ic{transform:rotate(180deg)}
.sbox{position:relative;display:block;flex:1;min-width:220px;max-width:440px}
.sbox .ic{position:absolute;inset-inline-start:12px;top:12px;color:var(--mu);pointer-events:none}
.sbox input{padding-inline-start:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);transition:all .2s}
.chips button:hover{border-color:var(--ac)}
.chips .on{background:var(--ac2);color:var(--ac);border-color:var(--ac);font-weight:600}
.drop{display:block;border:1.5px dashed var(--ln);border-radius:18px;padding:34px 18px;text-align:center;cursor:pointer;background:var(--sf);transition:border-color .2s,background .2s,transform .2s}
.drop:hover{border-color:var(--ac);background:var(--ac2)}
.drop:active{transform:scale(.99)}
.drop .ic{width:30px;height:30px;color:var(--ac);margin-bottom:10px}
.first .drop{padding:58px 18px}
.first .drop .ic{animation:fl 3.2s ease-in-out infinite}
.cam{display:none}
@media(hover:none) and (pointer:coarse){.cam{display:inline-flex}}
.up{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);animation:fade .25s}
.up:last-child{border:0}
.up[data-s=d]{animation:done .45s}
.ui{width:40px;height:40px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;color:var(--mu);flex:none;transition:background .3s,color .3s}
.up[data-s=d] .ui{background:var(--ac2);color:var(--ac)}
.up[data-s=e] .ui{color:var(--er)}
.ub{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.un{display:flex;gap:10px;align-items:baseline;justify-content:space-between;min-width:0}
.un b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un span{flex:none}
.pb{height:5px;border-radius:5px;background:var(--sf2);overflow:hidden;position:relative}
.pb i{display:block;height:100%;width:0;background:var(--ac);border-radius:5px;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.up[data-s=a] .pb i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:translateX(calc(-100%*var(--d)));animation:sh 1.2s infinite}
.up[data-s=d] .pb i{width:100%!important}
.up[data-s=e] .pb i{background:var(--er)}
.inb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);animation:fade .3s}
.inb:last-child{border:0}
.hit{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:10px 4px;border-bottom:1px solid var(--ln);text-align:start;transition:background .15s}
.hit:last-child{border:0}
.hit:hover{background:var(--sf2)}
.hit .fn{flex:1}
.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--wn) 13%,transparent);margin-bottom:14px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sf2);color:var(--mu)}
td[contenteditable]{outline:0;transition:background .15s,box-shadow .15s;min-width:70px}
td[contenteditable]:focus{background:var(--ac2);box-shadow:inset 0 0 0 2px var(--ac)}
.dh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.dt{flex:1 1 240px;min-width:0}
.dt .row{gap:4px 12px;margin-top:4px}
.da{gap:8px;flex-wrap:nowrap}
.lst{list-style:none;padding:0;display:grid;gap:10px}
.lst li{display:flex;gap:10px;align-items:baseline}
.pres{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 24px calc(18px + env(safe-area-inset-bottom));animation:fade .25s}
.pres .st{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:900px;width:100%;margin:0 auto;animation:fade .35s}
.pres .big{font-size:clamp(28px,6vw,52px);font-weight:600;line-height:1.2}
.pres .lst{font-size:clamp(17px,2.6vw,24px);gap:18px}
.md{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.mdc{background:var(--sf);border-radius:18px;padding:22px;width:min(520px,92%);max-height:90%;overflow:auto;box-shadow:var(--sh);animation:up .25s}
.rr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.rr b{width:46px;flex:none}
.rr .in{flex:1;min-width:0}
.rr .bd{min-width:74px}
.rs{width:44px;flex:none}
.toast{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;animation:up .25s;font-size:14px}
.ck path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .1s forwards}
.dock{position:fixed;z-index:25;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline-start:var(--sw);inset-inline-end:0;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.dock.hid{opacity:0;transform:translateY(26px);visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s}
.pill,.fab{pointer-events:auto}
.pill{display:flex;gap:2px;padding:6px;border-radius:28px;background:color-mix(in srgb,var(--sf) 62%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid color-mix(in srgb,var(--ln) 75%,transparent);box-shadow:0 16px 36px -14px #0b1f1a66,0 2px 8px #0b1f1a14,inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent)}
:root[data-t=dark] .pill{box-shadow:0 16px 36px -14px #000c,0 2px 8px #0008,inset 0 1px 0 #ffffff14}
.dk{min-width:66px;min-height:52px;padding:6px 10px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;line-height:1.2;color:var(--mu);transition:background .25s,color .25s,transform .15s}
.dk span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .ic{transition:transform .25s}
.dk:hover{color:var(--ink)}
.dk.on{color:var(--ac);background:var(--ac2);font-weight:600}
.dk.on .ic{transform:translateY(-1px) scale(1.08)}
.dk.off{opacity:.45}
.dk:active{transform:scale(.93)}
.fab{width:52px;height:52px;border-radius:50%;background:var(--ac);color:var(--bt);display:grid;place-items:center;box-shadow:0 12px 26px -10px var(--ac),0 2px 6px #0b1f1a24;transition:transform .2s,box-shadow .2s}

.scrim{position:fixed;inset:0;z-index:34;background:#0006;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#pop{position:fixed;inset:0;z-index:70}
.pscrim{position:absolute;inset:0}
.pm{position:fixed;min-width:160px;max-height:min(320px,60vh);overflow:auto;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--ln);box-shadow:0 18px 40px -16px #000a,0 2px 8px #0b1f1a1a;animation:pp .16s cubic-bezier(.2,.8,.2,1);transform-origin:top}

.pm button:hover,.pm button:focus-visible{background:var(--sf2);outline:0}
.pm button.on{color:var(--ac);font-weight:600}
#dropov{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;pointer-events:none;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.dg #dropov{display:flex}
.dz2{border:2px dashed var(--ac);border-radius:24px;padding:48px 56px;display:grid;justify-items:center;gap:12px;font-size:18px;background:var(--ac2);color:var(--ac);animation:up .2s}
.dz2 .ic{width:34px;height:34px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pp{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 0%,transparent),0 0 0 0 var(--wn)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sh{to{transform:translateX(calc(100%*var(--d)))}}

@keyframes done{0%{transform:scale(.985);background:var(--ac2)}100%{transform:none;background:transparent}}
.sech{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 4px 10px;font-size:13px;color:var(--mu)}

.fi.sl{background:var(--ac2)}

.infoc{display:grid;gap:14px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.danger{color:var(--er)}
.up[data-s=w] .ui{color:var(--wn)}
.up[data-s=e] .pb,.up[data-s=w] .pb{display:none}
textarea.in{padding:10px 12px;min-height:120px;width:100%;resize:vertical;line-height:1.5;display:block}
.bar{height:6px;border-radius:6px;background:var(--sf2);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}

.bx{background:var(--sf);padding:16px 22px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ln);border-top-color:var(--ac);animation:rot .8s linear infinite!important}

.lst.sm li{align-items:center}
@media(max-width:800px){
.app{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;top:0;bottom:0;inset-inline-start:0;height:auto;width:min(86vw,320px);z-index:35;padding:calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));background:var(--sf);transform:translateX(calc(-100%*var(--d)));visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;box-shadow:var(--sh)}

for(let i=0;i<chunks&&count<80;i++,count++){s=p.addSlide();head(sh.name+(chunks>1?` (${i+1}/${chunks})`:''));
const hdr=sh.cols.map(c=>({text:String(c),options:{bold:true,fill:{color:'E3EFEC'},color:INK,align:al,rtlMode:rtl,fontFace:F,fontSize:fs}})),rows=sh.rows.slice(i*per,(i+1)*per).map(r=>sh.cols.map((_,ci)=>{const v=r[ci]??'';return{text:isN(v)?fmt(v):String(v),options:{align:isN(v)?'right':al,fontFace:F,fontSize:fs,color:INK,rtlMode:rtl}}}));
s.addTable([hdr,...rows],{x:.6,y:1.3,w:12.1,border:{type:'solid',pt:.5,color:'D5DEDB'},valign:'middle',margin:[.04,.08,.04,.08]})}}
await p.writeFile({fileName:fn+'.pptx'})}
/* ---------- presentation ---------- */
function beginPresent(list){const d=S.doc;PSL={si0:d.si,list};sl=0;$('#ov').innerHTML='<div class="pres" role="dialog" aria-modal="true"></div>';slide()}
function startPresent(){const d=S.doc;if(!d)return;if(!presOK(d)){toast(d.status==='review'?t('whyConf'):t('whyNum'));return}
if(d.sheets.length<2){beginPresent([d.si]);return}if(S.mode==='edit')readEd();syncSheet(d);
secDlg({title:t('secPresT'),items:secItems(d.sheets,hasNum),sel:hasNum(d.sheets[d.si])?[d.si]:[],actions:[{id:'go',label:t('present'),icon:'pres',min:1}]}).then(r=>{if(r&&r.id==='go'&&S.doc===d)beginPresent(r.sel)})}
const psTotal=()=>PSL?PSL.list.length*3:3;
function slide(){const d=S.doc,p=$('.pres');if(!p)return;if(ch){ch.destroy();ch=null}
const si=PSL?PSL.list[Math.floor(sl/3)]:d.si,kd=sl%3,total=psTotal();setSheet(d,si);const k=keyInfo(d),sn=d.sheets.length>1?shLab(d.sheets[si],si):'',cap=sn?`<p class="mu sm" style="margin-bottom:8px">${esc(sn)}</p>`:'';
const B=[`<h1 class="big">${esc(nm(d))}</h1>${sn?`<p style="font-size:22px;margin-top:10px;color:var(--ac);font-weight:600">${esc(sn)}</p>`:''}<p class="mu" style="font-size:20px;margin-top:14px">${esc(k.label)}: ${fmt(conv(k.val,d.ccy))} ${S.base}</p>`,`${cap}<div class="cw" style="height:min(60vh,420px)"><canvas id="pc"></canvas></div>`,`${cap}<ul class="lst">${sumLines(d).map(x=>`<li><span class="dot"></span><span>${esc(x)}</span></li>`).join('')}</ul>`];
const rtl=S.lang==='ar';p.innerHTML=`<div class="row"><span class="sp"></span><button class="ib" onclick="endPresent()" aria-label="${t('cls')}">${ic('x')}</button></div><div class="st" key="${sl}">${B[kd]}</div><div class="row" style="justify-content:center"><button class="ib" ${sl?'':'disabled'} onclick="sl--;slide()" aria-label="prev">${ic(rtl?'chr':'chl')}</button><span class="mu">${sl+1} / ${total}</span><button class="ib" ${sl<total-1?'':'disabled'} onclick="sl++;slide()" aria-label="next">${ic(rtl?'chl':'chr')}</button></div>`;
if(kd===1){const c=chartData(d);mk($('#pc'),c.labels,c.sets,S.ct,false)}}
function endPresent(){$('#ov').innerHTML='';if(ch){ch.destroy();ch=null}const d=S.doc,ps=PSL;PSL=null;if(ps&&d&&d.si!==ps.si0){setSheet(d,ps.si0);if(S.tab==='doc'){detailV();dockU();return}}if(S.tab==='doc'&&S.mode==='chart')modeV()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#pop')){closeDD();return}if(document.body.classList.contains('dr')){drawer(0);return}if($('.pres'))endPresent();else $('#ov').innerHTML=''}if($('.pres')){const rtl=S.lang==='ar';if(e.key==='ArrowRight'||e.key==='ArrowLeft'){const nx=sl+(e.key==='ArrowRight'?(rtl?-1:1):(rtl?1:-1));if(nx>=0&&nx<psTotal()){sl=nx;slide()}}}});
/* drag files anywhere on the page */
let dc=0;const hasF=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(!hasF(e))return;e.preventDefault();dc++;document.body.classList.add('dg')});
addEventListener('dragover',e=>{if(hasF(e))e.preventDefault()});
addEventListener('dragleave',e=>{if(!hasF(e))return;dc=Math.max(0,dc-1);if(!dc)document.body.classList.remove('dg')});
addEventListener('drop',e=>{if(!hasF(e))return;e.preventDefault();dc=0;document.body.classList.remove('dg');if(!$('.pres'))onFiles(e.dataTransfer.files)});
/* ---------- rates ---------- */
function openRates(){const rows=ccys.filter(c=>c!=='USD').map(c=>`<div class="rr"><b>${c}</b><input class="in" type="number" inputmode="decimal" step="any" min="0" value="${+rate(c).toFixed(4)}" aria-label="${c}" onchange="setRate('${c}',this.value)"><span class="bd ${over[c]!=null?'review':''}"><i></i><span>${over[c]!=null?t('man'):liveAt?t('live'):t('ref')}</span></span>${over[c]!=null?`<button class="ib" title="${t('resetR')}" aria-label="${t('resetR')}" onclick="resetRate('${c}')">${ic('x')}</button>`:'<span class="rs"></span>'}</div>`).join('');
$('#ov').innerHTML=`<div class="md" onclick="if(event.target===this)this.remove()"><div class="mdc" role="dialog" aria-modal="true"><div class="row"><h2 style="flex:1;margin:0">${t('rates')}</h2><button class="ib" onclick="$('#ov').innerHTML=''" aria-label="${t('cls')}">${ic('x')}</button></div><div class="row" style="margin:14px 0;justify-content:space-between"><span>${t('base')}</span><div style="min-width:130px">${dd('base',ccys.map(c=>[c,c]),S.base,v=>{S.base=v;save();log('Base: '+S.base);openRates();view()})}</div></div><p class="mu sm" style="margin-bottom:2px">${t('perUsd')}</p>${rows}<p class="mu sm" style="margin-top:12px">${liveAt?tm(liveAt)+' · ':''}${liveAt?'':t('refNote')}</p><p class="mu sm" style="margin-top:6px">${t('manNote')}</p></div></div>`}
function setRate(c,v){v=+v;if(!(v>0))return openRates();const old=rate(c),apply=()=>{if(v===R[c])delete over[c];else over[c]=v;save();log(`${c}: ${+old.toFixed(4)} → ${v} (${t('man')})`);toast(`${c} ${v}`);openRates();view()};if(Math.abs(v/R[c]-1)>.05)askC(t('devQ'),apply,openRates);else apply()}
function resetRate(c){delete over[c];save();log(`${c}: ${t('resetR')}`);openRates();view()}
async function fetchRates(){try{const r=await fetch('https://open.er-api.com/v6/latest/USD'),j=await r.json();if(j.result==='success'){ccys.forEach(c=>{if(j.rates[c])R[c]=j.rates[c]});liveAt=new Date();log('Live rates updated');chipU();if(!$('.pres')&&!$('.md')&&!(S.tab==='doc'&&S.mode==='edit')&&S.tab!=='add')view()}}catch(e){}}
async function init(){try{DB=await idbOpen();D=(await dbAll('docs')).map(normDoc).sort((a,b)=>(b.added||0)-(a.added||0));uid=Math.max(4,...D.map(d=>d.id));const lg=await dbGet('kv','logs');if(Array.isArray(lg)&&lg.length)logs=lg}catch(e){DB=null;D=[];setTimeout(()=>toast(t('noStore')),700)}
if(!logs.length)log('Workspace ready');S.tab=D.length?'home':'add';render();fetchRates();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
/* ---------- app icon: shown in the browser tab, and outside the browser when installed as an app ---------- */
function appIcons(){try{
const G='<path d="M10 6h8.5L24 11.5V25a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" fill="#fff"/><path d="M18.5 6v4.5a1 1 0 0 0 1 1H24" fill="#0B7A6B" opacity=".35"/><path d="m12.8 18.4 2.6 2.6 4.8-5.2" fill="none" stroke="#0B7A6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
const mkSvg=full=>'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">'+(full?'<rect width="32" height="32" fill="#0B7A6B"/><g transform="translate(16 16) scale(.78) translate(-16 -16)">'+G+'</g>':'<rect width="32" height="32" rx="9" fill="#0B7A6B"/>'+G)+'</svg>';
const load=svg=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
const png=(img,n)=>{const c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(img,0,0,n,n);return c.toDataURL('image/png')};
Promise.all([load(mkSvg(false)),load(mkSvg(true))]).then(([a,f])=>{
const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=png(f,180);document.head.appendChild(ap);
if(!/^https?:$/.test(location.protocol))return;
const man={name:'Sijill — سجل',short_name:'Sijill',description:'Sijill',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^/]*$/,''),display:'standalone',background_color:'#F5F7F6',theme_color:'#0B7A6B',icons:[{src:png(a,192),sizes:'192x192',type:'image/png',purpose:'any'},{src:png(a,512),sizes:'512x512',type:'image/png',purpose:'any'},{src:png(f,192),sizes:'192x192',type:'image/png',purpose:'maskable'},{src:png(f,512),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(ml)}).catch(()=>{})}catch(e){}}
appIcons();

init();
